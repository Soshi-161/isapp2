<!DOCTYPE html>

<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <script type="text/javascript" src="../lib/jquery.min.js"></script>
    <script type="text/javascript" src="../lib/osql.js"></script>
    <script>
        osql.requireLogin();//すべてのページに入れる．google認証をして，osql.connect()や，osql.getMe()を使えるようにしてくれる．

        const tweetButtonPressed = async () => {
            var userid = document.getElementById('tf1').value;
            var tweet = document.getElementById('tf2').value;

            var sql = `insert into Tweets (name, tweet, time) values("${userid}", "${tweet}", now());`;
            var objects = await osql.connect(sql);
            console.log(objects);

            alert("tweetしました");
        }

        function button1Pressed() {
            doSelect();
        }

        async function doSelect() {
            var sql = 'select * from Tweets order by time desc limit 20';
            var objects = await osql.connect(sql);
            console.log(objects);
            var html = '';
            html = html + '<table style="border-collapse: collapse; width: 100%;">';
            for (object of objects) {
                html = html + '<tr><td style="padding: 8px;">' + object.name + '</td><td style="padding: 8px;">' + object.tweet + '</td><td style="padding: 8px; color: #777;">(' + object.time + ')</td></tr>';
            }
            html = html + '</table>';
            document.getElementById('result').innerHTML = html;
        }

        $().ready(function () {
            doSelect();
            setInterval(doSelect, 2000);
        });


    </script>

</head>

<body>
    <h1>Tweets</h1>
    <br>
    名前:<input id="tf1" value="名無し" type="textfield">
    <br>
    tweet:<input id="tf2" type="textfield">
    <button onclick="tweetButtonPressed()">tweet</button>
    <br>
    <hr>
    <p id="result">xxxx</p>

    
</body>

</html>
